name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "onefordream"
          git config user.email "onefordream@users.noreply.github.com"
          git mv craftory-zhi-zuo-sabisuhp.html index.html
          git commit -m "Rename to index.html"
          git push
